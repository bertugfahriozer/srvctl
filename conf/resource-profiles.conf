# ═══════════════════════════════════════════════
#  srvctl — Kaynak (PHP-FPM pool + cgroups v2) Profilleri
#  Format: profil:pm_mode:max_children:memory_limit_mb:tasks_max
#  Zone'lar/limitler lib/domain.sh + lib/core.sh tarafından bu dosyadan
#  OKUNUR (conf/rate-profiles.conf + rate_profile_* deseninin BİREBİR
#  karşılığı — bkz. lib/core.sh:685 rate_profile_line/field/names/resolve/
#  load). Bu profil ailesi için beklenen isimlendirme 'resource_profile_*'.
# ═══════════════════════════════════════════════

# ─── ALANLAR (SAKLANAN — sözleşme, DEĞİŞTİRİLMEDİ) ───
#   1) profil            benzersiz ad (rate-profiles.conf ile aynı deseni takip eder)
#   2) pm_mode            php-fpm 'pm' yönergesi: ondemand | dynamic
#   3) max_children       pm.max_children — eşzamanlı PHP worker tavanı
#   4) memory_limit_mb    php_admin_value[memory_limit], MB (birim EKLENMEDEN
#                         saklanır; pool.conf.tpl'e basılırken '<n>M' yapılır)
#   5) tasks_max          cgroups TasksMax — DOĞRUDAN girdi (max_children'dan
#                         formülle türetilmez): FPM master+worker'lar +
#                         per-domain queue worker/scheduler süreçleri için pay

# ─── TÜRETİLEN DEĞERLER (BU DOSYADA SAKLANMAZ — okuma anında hesaplanır) ───
# Neden saklamıyoruz: pool.conf.tpl (pm.max_children/memory_limit) ile
# cgroups/domain.slice.tpl (MemoryHigh/Max/SwapMax) daha önce İKİ AYRI SABİT
# olarak elle senkron tutuluyordu (pool.conf.tpl: 16×256M vs.
# lib/domain.sh:_domain_cgroups_defaults: 4096M/4608M/512M/200) — ikisi
# ayrışınca sessiz bir kapasite/OOM açığı doğuyordu. Tek doğruluk kaynağı bu
# dosyadaki 4 alan; aşağıdaki formüller HER OKUMADA yeniden hesaplanmalı:
#
#   MemoryHigh (MB)    = max_children × memory_limit_mb
#                        (pool'un teorik tepe bellek talebi — throttle eşiği)
#   MemoryMax (MB)     = MemoryHigh × 9/8  (tamsayı aritmetiği; ≈ ×1.125)
#                        (%12,5 OOM payı — throttle ile hard kill arasında nefes)
#   MemorySwapMax (MB) = MemoryHigh / 8  (tamsayı bölme, taban 1M)
#                        (0 DEĞİL — Dalga 5'te MemorySwapMax=0 iken iki
#                        eşzamanlı ağır isteğin OOM-kill ürettiği HOST'ta
#                        doğrulanmıştı; bkz. eski _domain_cgroups_defaults
#                        yorumu. Grace, havuz büyüdükçe ORANTILI büyür.
#                        NOT: bu 3 formül lib/core.sh:resource_profile_load
#                        içinde GERÇEKTEN böyle uygulanıyor (bkz. rapor) —
#                        'micro' profilinde (max_children=4×128M=512M tepe)
#                        swap payı yalnız 64M çıkar; sabit bir taban (ör.
#                        256M) EKLENMEDİ, çünkü 512M'lik bir pool için 64M
#                        zaten oranının 1/8'i ve tek worker'ın tüm limitini
#                        aşması durumunu karşılıyor — küçük profillerde MUTLAK
#                        değerin küçük olması SORUN DEĞİL, ORANIN sıfır
#                        OLMAMASI önemliydi. Daha yüksek bir taban isteniyorsa
#                        bu lib/core.sh'ta ayrı bir karardır, bu dosyanın
#                        sözleşmesini etkilemez.)
#
# php-fpm pm.start_servers / pm.min_spare_servers / pm.max_spare_servers de
# BU DOSYADA SAKLANMAZ; lib/core.sh:resource_profile_load içinde
# max_children'dan tamsayı bölmeyle türetilir (min_spare=max_children/8,
# start=max_children/4, max_spare=clamp(max_children/2, start, max_children))
# ve pm_mode=ondemand olsa BİLE HER ZAMAN üretilip basılır — php-fpm bu üç
# anahtarı o modda sessizce YOK SAYAR, config hatası VERMEZ (Ubuntu
# 22.04/php8.1 VE 24.04/php8.3 üzerinde 'php-fpm -t' ile doğrulandı — bkz.
# ops-infra raporu). ör. ecommerce (max_children=16) → min=2 start=4 max=8;
# heavy (32) → min=4 start=8 max=16.

# ─── PROFİL SEÇİMİ — gerekçe ───
#  micro     : ondemand — düşük trafik (kurumsal broşür/portföy/staging).
#              Worker'lar çoğu zaman boşta; ondemand'ın ilk-istek fork
#              gecikmesi (~birkaç ms) kabul edilebilir — 100 domain
#              ölçeğinde boşta bellek TUTMAMAK daha değerli.
#  standard  : ondemand — orta trafik kurumsal site/blog/kurumsal panel;
#              dönüşüm-kritik DEĞİL (checkout/ödeme akışı yok). Aynı
#              ondemand mantığı geçerli, sadece tavan biraz daha yüksek.
#  ecommerce : dynamic — dönüşüm-kritik. ondemand'ın fork-on-first-request
#              gecikmesi ürün/sepet/checkout sayfasında DOĞRUDAN gelir
#              kaybıdır (TTFB/Core Web Vitals). dynamic ile en az
#              min_spare_servers kadar worker HER ZAMAN sıcak bekler;
#              kampanya/flash-sale patlamalarında start_servers→max_spare
#              aralığı, ondemand'ın idle-timeout döngüsünden daha hızlı
#              tepki verir. Ayrıca queue worker/scheduler'ların (kargo
#              etiketi, fatura, stok senkronu) arka planda sürekli DB/Redis
#              ile konuşması nedeniyle pool zaten "ısınmış" kalır.
#  heavy     : dynamic — en yoğun kiracılar: büyük rapor/export üretimi,
#              medya/görsel işleme, çoklu mağaza agregasyonu (marketplace),
#              Black Friday/flash-sale sınıfı zirve trafik. max_children=32
#              ve memory_limit=768M, uzun süren/bellek-ağır istekleri
#              (toplu içe/dışa aktarım, PDF/rapor üretimi) OOM'suz
#              karşılamak için ecommerce'ten yüksek tutuldu.
#
# KAPSAM DIŞI (bilinçli — bash-developer ile paylaşılan sözleşmeyi 5 alanın
# ÖTESİNE genişletmemek için): max_execution_time, upload_max_filesize,
# request_terminate_timeout profile göre DEĞİŞMİYOR; pool.conf.tpl'de sabit
# kalıyor. "Uzun istekler" ekseni bu turda ele alınmadı — bkz. rapor.

# profil:pm_mode:max_children:memory_limit_mb:tasks_max
micro:ondemand:4:128:60
standard:ondemand:8:256:120
ecommerce:dynamic:16:512:300
heavy:dynamic:32:768:500
