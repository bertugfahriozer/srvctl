# ═══════════════════════════════════════════════
#  srvctl — Yapılandırma Dosyası
# ═══════════════════════════════════════════════

# PHP varsayılan versiyonu
DEFAULT_PHP_VERSION=8.3

# SSH portu
SSH_PORT=2222

# Web dizini kökü
WEB_ROOT=/var/www

# Yedekleme dizini
BACKUP_DIR=/backups

# Yedek saklama süresi (gün)
BACKUP_RETENTION_DAYS=30

# Deployer kullanıcısı
DEPLOYER_USER=deployer

# ─── Per-domain FPM izolasyonu (Faz 2/T7a — Seçenek C) ───
# Varsayılan (yorumlu bırakılırsa core.sh/load_config'te 'true') AÇIK:
# 'domain add' sonunda her domain otomatik olarak paylaşılan php<ver>-fpm
# master'ından kendi 'srvctl-fpm-<sname>.service' unit'ine (AppArmor +
# cgroups + seccomp GERÇEKTEN attach) taşınır. Migrasyon fail-closed'dır:
# başarısız olursa domain paylaşılan pool'da çalışmaya devam eder, 'domain
# add' asla başarısız SAYILMAZ (elle 'srvctl security harden-fpm <domain>
# --apply' önerilir). Per-domain override için '.srvctl-meta' dosyasına
# 'ISOLATED_FPM=true|false' ekleyin (whitelist/validate_bool doğrulamalı).
# DOMAIN_ISOLATED_FPM=true

# ─── Deploy release saklama ───
# Tutulacak release sayısı (canlı release her zaman ayrıca korunur).
# Rollback hedefi gerektiğinden en az 2 olmalıdır.
DEPLOY_KEEP_RELEASES=5

# 'deploy prune --include-bak' ile silinecek public_html.bak.* için gün eşiği
DEPLOY_PRUNE_BAK_DAYS=7

# ─── Deploy Davranışı ───
# Varsayılanlar core.sh/load_config'te tanımlıdır; burada YORUMLU bırakılmıştır
# — aktifleştirmek için '#' kaldırıp değeri değiştirin.
#
# Deploy sırasında otomatik DB migration ÇALIŞTIRMA. Varsayılan false: migration
# rollback ile geri alınamaz; otomatik migration + health-check kaynaklı otomatik
# rollback birleşimi şema/veri arasında sessiz tutarsızlık üretebilir. Bu bilinçli
# bir operatör kararı olmalı (per-domain açmak için .srvctl-meta kullanılabilir).
# DEPLOY_RUN_MIGRATIONS=false
#
# Deploy sırasında 'npm ci && npm run build' ÇALIŞTIRMA. Varsayılan false.
# DEPLOY_NPM_BUILD=false
#
# Sağlık kontrolü deneme sayısı ve denemeler arası bekleme (saniye). Tek atışlık
# probe + 'pm = ondemand' soğuk worker → yanlış negatif → gereksiz oto-rollback.
# DEPLOY_HEALTH_RETRIES=5
# DEPLOY_HEALTH_INTERVAL=2
#
# Sağlıklı sayılan HTTP kodları (boşlukla ayrılmış). 404/403 KASITLI OLARAK
# listede yok: composer/vendor kurulmamış bir release nginx 404 dönebilir ve
# yanlışlıkla "sağlıklı" sayılıp canlıya alınabilir. Bu GLOBAL varsayılandır
# — TÜM domainleri etkiler; buradan gevşetmek TÜM domainlerde gerçek bir
# arızayı (ör. gerçek bir 401/403) görünmez kılabilir.
# DEPLOY_HEALTH_OK_CODES="200 301 302"
#
# Yalnız TEK bir domain için gevşetmek gerekiyorsa (ör. HTTP Basic auth ile
# korunan, kimliksiz isteğe BİLİNÇLİ olarak 401 dönen bir staging/preview
# sitesi — bu "site kırık" değil "site doğru davranıyor" demektir) global
# değeri DEĞİŞTİRMEYİN. Bunun yerine o domainin '.srvctl-meta' dosyasına
# (root olarak) 'HEALTH_OK_CODES=200 301 302 401' satırını ekleyin. Bu
# override YALNIZ o domaini etkiler, deploy/rollback/health çıktısında
# AÇIKÇA görünür ("... bu domain için KABUL EDİLEN kod olarak
# yapılandırılmış") ve global varsayılanı asla sessizce gevşetmez.
# (NOT: 'HEALTH_OK_CODES' anahtarının 'harden-fs' sonrası kalıcı olması için
# 'lib/security.sh:_meta_known_keys' beyaz listesinde de tanımlı olması
# gerekir.)

# Redis admin şifresi (srvctl init tarafından doldurulur)
# REDIS_ADMIN_PASS=

# ─── Güvenilir edge-IP senkronu (Cloudflare + UptimeRobot) ───
# Bu IP'ler fail2ban ignoreip'e eklenir (asla banlanmaz); Cloudflare için nginx
# real-IP restorasyonu kurulur. Günlük cron ile tazelenir. Varsayılanlar load_config'te.
# TRUSTED_SYNC_ENABLED=true
# TRUSTED_SOURCES="cloudflare uptimerobot"
# TRUSTED_STATE_DIR=/etc/srvctl/trusted
# CLOUDFLARE_IPS_V4_URL="https://www.cloudflare.com/ips-v4"
# CLOUDFLARE_IPS_V6_URL="https://www.cloudflare.com/ips-v6"
# UPTIMEROBOT_IPS_URL="https://uptimerobot.com/inc/files/ips/IPv4andIPv6.txt"
