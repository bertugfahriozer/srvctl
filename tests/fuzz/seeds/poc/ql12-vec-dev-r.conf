# FileManager — yükleme parçası (ARCHITECTURE.md §8.1, §6, §5(a), §15 madde 8).
# Kurulum: /etc/nginx/custom.d/designwestgate_art/20-fm-upload.conf (README.md).
# ÖNKOŞUL: `srvctl domain fm-auth <domain> on --script=...` AÇIK olmalı —
# `/__fm_auth` ve `srvctl-fm-upload-*.inc` dosyalarını srvctl üretir; bu dosya
# fastcgi_pass / modsecurity DİREKTİFİ İÇERMEZ (custom.d yasakları geçerli).
# fm-auth KAPALI/EKSİKSE yükleme yolu 403 verir (fail-closed, aşağıda "KAPI 1/2").
#
# Sözleşme (canlı ölçümle doğrulandı: [canlı-stream-2] S1/S2, [canlı-buffer] B1/B2):
#  - Yol: /_fm/up/{uploadid}/{offset} — yalnız rakam/rakam, UZANTI YOK
#    (vhost'un statik/PHP regex location'ları eşleşmesin; §8.1 "Location sırası").
#  - Yalnız PUT + Content-Length (chunked pCloud'a ham veri olarak yazılır: T2b).
#  - Gövde nginx'te tamponlanmaz (proxy_request_buffering off): diske/RAM'e yazılmaz.
#  - Token (OAuth) YALNIZ başlıkta: auth alt isteği X-Fm-Auth döner,
#    Authorization olarak pCloud'a verilir. Sorgu dizesinde ASLA (error.log sızıntısı: N4a).
#  - Bu vhost'ta `error_log ... debug` / `debug_connection` YASAK (token başlığı dökülür).
#  - pCloud'a giden başlıklar İZİN LİSTESİdir (proxy_pass_request_headers off):
#    Host, Authorization, Content-Type (+ nginx'in kendi Content-Length'i). Başka istemci
#    başlığı (Cookie, X-Fm-Ticket, X-CSRF-TOKEN, Forwarded, X-Forwarded-*, Sec-*,
#    User-Agent ...) pCloud'a GİTMEZ; yeni bir başlık gerekirse buraya açıkça yazılır.
#  - pCloud YANITINDAKİ X-Accel-* başlıkları yok sayılır (iç yönlendirme/tampon
#    anahtarı olmasın) ve istemciye iletilmez; Access-Control-* ve Set-Cookie gizlenir.
#
# add_header KULLANILMAZ (üst bloğun güvenlik başlıklarını düşürür); yanıt gövdesini
# pCloud JSON'u olarak olduğu gibi iletir.
#
# İKİ KAPI (derinlemesine savunma): (1) KAPI 1 = `$fm_gate` (srvctl inc; fm-auth kapalıyken
# istek hiçbir alt isteğe/CI4'e gitmez); (2) KAPI 2 = @fm_up içinde boş-token 403'ü
# (fm-auth açık ama auth ucu 2xx + başlıksız dönerse pCloud'a gitme).
#
# İKİ AŞAMA (KAPI 2): auth_request ERİŞİM aşamasında çalışır, `if` ise ondan ÖNCE
# (rewrite aşaması) — `auth_request_set` değişkeni `if` ile aynı location'da
# denetlenemez. Bu yüzden asıl location auth'u yapar, `try_files` ile ADLI
# location'a (@fm_up) iç yönlendirir; orada rewrite aşaması yeniden çalışır ve
# `$fm_auth` doludur. auth ucu tanımsızsa alt istek vhost'un normal yoluna düşer
# (2xx dönebilir, X-Fm-Auth başlığı OLMAZ) → `$fm_auth` boş/"Bearer " dışı → 403.

# Regex TIRNAK İÇİNDE olmalı: tırnaksız `{1,20}` nginx'te blok başlangıcı sayılır
# ("pcre2_compile() failed: missing closing parenthesis" — nginx 1.28 ile ölçüldü).
location ~ "^/_fm/up/(?<fm_uid>[0-9]{1,20})/(?<fm_off>[0-9]{1,20})$" {
    if ($remote_addr != 127.0.0.1) { return 403; }
    # KAPI 1 (srvctl kapısı, rewrite aşaması, İLK satırlar — başka direktiften ÖNCE):
    # `fm-auth on` iken srvctl-fm-upload-*.inc içine `set $fm_gate 1;` (+ varsa
    # `modsecurity off;`: WAF gövdeyi tamponlayıp akıtmayı bozmasın) yazar. inc yoksa
    # (fm-auth hiç açılmamış / `off`) glob boş eşleşir (nginx -t hata vermez),
    # $fm_gate 0 kalır → istek auth alt isteğine ve CI4'e HİÇ ULAŞMADAN 403.
    # `include` YALNIZ doğrudan bu location'da durmalı (srvctl tarayıcısı ister).
    set $fm_gate 0;
    include /etc/nginx/custom.d/designwestgate_art/srvctl-fm-upload-*.inc;
    if ($fm_gate != 1) { return 403; }

    # Yalnız PUT. (GET boş gövdeyle pCloud'da upload_write'ı tetikler: S4d.)
    limit_except PUT { deny all; }

    # Content-Length zorunlu (rewrite aşaması: auth_request'ten ÖNCE çalışır).
    if ($http_content_length = "") { return 411; }

    # Parça 32 MiB; auth alt isteği KENDİ location'ının sınırını da uygular
    # (/__fm_auth: 33m — srvctl şablonu), ikisi birlikte olmalı (N2: 413→500).
    client_max_body_size 33m;

    # Adlı location'a geçişte regex yakalamalarının (nginx 1.28'de korunduğu ölçüldü)
    # sürümler arası garantisi yok: değerleri düz değişkenlere kopyala (rewrite
    # aşaması, auth'tan önce). Sigorta; davranışı değiştirmez.
    set $fm_up_uid $fm_uid;
    set $fm_up_off $fm_off;

    auth_request /__fm_auth;
    auth_request_set $fm_auth $upstream_http_x_fm_auth;

    # Auth geçtiyse adlı location'a iç yönlendir (dosya hiçbir zaman var olmaz).
    try_files /__fm_never_exists @fm_up;
}

location @fm_up {
    # KAPI 2 (M2): auth ucu yoksa/boş token döndüyse (alt istek CI4'e düşse bile)
    # pCloud'a ASLA gitme. 403, auth ucunun kendi reddiyle aynı durumdur.
    if ($fm_auth !~ "^Bearer .+$") { return 403; }

    client_max_body_size 33m;

    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;

    # Sabit pCloud ana makinesi (pcloud_settings.region ile eşleşen allowlist;
    # EU: eapi.pcloud.com, US: api.pcloud.com). DEĞİŞKEN HOST YOK.
    proxy_ssl_server_name on;
    proxy_ssl_name eapi.pcloud.com;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;

    # İZİN LİSTESİ: istemci başlıklarının HİÇBİRİ otomatik geçmez (değişmez 8).
    proxy_pass_request_headers off;
    proxy_set_header Host eapi.pcloud.com;
    proxy_set_header Authorization $fm_auth;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Connection "";

    # pCloud yanıtı: X-Accel-* etkisiz (iç yönlendirme / tampon / hız anahtarı
    # olmasın) ve istemciye iletilmez; CORS ve çerez başlıkları gizlenir.
    proxy_ignore_headers X-Accel-Redirect X-Accel-Expires X-Accel-Limit-Rate X-Accel-Buffering X-Accel-Charset;
    proxy_hide_header X-Accel-Redirect;
    proxy_hide_header X-Accel-Expires;
    proxy_hide_header X-Accel-Limit-Rate;
    proxy_hide_header X-Accel-Buffering;
    proxy_hide_header X-Accel-Charset;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Max-Age;
    proxy_hide_header Set-Cookie;

    # 32 MiB'ı yavaş bir hat gönderebilir; zaman aşımı iki okuma arası içindir.
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    client_body_timeout 120s;

    # Değişkenli proxy_pass: çalışma anında ad çözümü → global `resolver` ŞART
    # (srvctl lib/init.sh: `resolver 1.1.1.1 8.8.8.8`). Yoksa her parça 502
    # ("no resolver defined to resolve eapi.pcloud.com"). README "Resolver".
    proxy_pass https://eapi.pcloud.com/upload_write?uploadid=$fm_up_uid&uploadoffset=$fm_up_off;
}
# FileManager — iç indirme/önizleme location'ı (ARCHITECTURE.md §8.2, §5(b), §15 madde 8).
# Kurulum: /etc/nginx/custom.d/designwestgate_art/21-fm-download.conf (README.md).
#
# CI4 yetkiyi verir, yanıtı `X-Accel-Redirect: /__fm_dl?u=<pcloud-link>` ile
# nginx'e devreder; Range/206 pCloud'dan olduğu gibi akar, PHP RAM'i ~0.
# `internal`: dışarıdan çağrılamaz (404). Hedef YALNIZ https://<etiket>.pcloud.com/ —
# açık proxy değildir (negatifler [canlı-nginx] N5n 4/4 + POST 403).
#
# BU LOCATION'DA add_header YOK: eklense üst bloğun HSTS/nosniff/CSP başlıkları
# düşer. Aksine `internal` yönlendirmede server düzeyindeki add_header'lar miras kalır.
# Content-Type pCloud'a getfilelink(contenttype=…) ile söylenir; Content-Disposition'ı
# PHP kurar, pCloud'unki gizlenir (çift başlık olmasın — Aşama 0 testi (i)).
#
# pCloud'a giden başlıklar İZİN LİSTESİdir (proxy_pass_request_headers off):
# Host, Range, If-Range, Connection. Çerez, X-Fm-Ticket, Authorization, X-CSRF-TOKEN,
# Forwarded, X-Forwarded-*, Sec-*, User-Agent ... GİTMEZ (iç yönlendirmede ORİJİNAL
# istemci başlıkları görünür — Aşama 0 testi (iii)); yeni başlık gerekirse açıkça yazılır.
#
# HATA GÜNLÜĞÜ SINIRI (L3): pCloud bağlantısının yolu bir erişim kimliğidir ve
# nginx upstream hatalarında `upstream: "https://<host>/<yol>"` olarak error.log'a
# yazılır. Bu location'ın günlüğü ayrı dosyaya ve `crit` düzeyine alınır → `error`
# düzeyindeki upstream hataları HİÇBİR dosyaya yazılmaz (erişim günlüğündeki 502 ve
# $upstream_status kalır). Hata ayıklamak için düzeyi geçici `error`a çekersen
# bağlantı yolları o DOSYAYA düşer; işin bitince `crit`e geri al. Sınır: bu yalnız
# location içi günlüğü kapsar (istek başlığı okunurken oluşan hatalar ana günlükte kalır).

location = /__fm_dl {
    internal;
    limit_except GET HEAD { deny all; }

    error_log /var/log/nginx/designwestgate_art-fm-dl.error.log crit;

    set $fm_u "";
    set $fm_h "";
    # Ana makine: en az bir etiket + `.pcloud.com`; etiket harf/rakamla başlar ve biter
    # (`..pcloud.com`, `.pcloud.com`, `-x.pcloud.com` reddedilir), `localhost` etiketi
    # yasak; yolda `..` yasak. Regex `{n,m}` içermez ama tırnaklı yazılır (kural).
    if ($arg_u ~ "^https://((?!(?:[a-z0-9-]+\.)*localhost\.)(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+pcloud\.com)/(?!.*\.\.)[A-Za-z0-9._~:/-]+$") {
        set $fm_u $arg_u;
        set $fm_h $1;
    }
    if ($fm_u = "") { return 403; }

    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_intercept_errors off;

    proxy_ssl_server_name on;
    proxy_ssl_name $fm_h;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;

    # İZİN LİSTESİ: istemci başlıkları otomatik GEÇMEZ (değişmez 8).
    proxy_pass_request_headers off;
    proxy_set_header Host $fm_h;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_set_header Connection "";
    # Savunma derinliği: izin listesi bozulup `proxy_pass_request_headers` açılsa bile
    # bilet pCloud'a gitmesin (değişmez 8 + §6).
    proxy_set_header X-Fm-Ticket "";

    # pCloud yanıtı: X-Accel-* etkisiz (X-Accel-Buffering: yes → proxy_buffering off'u
    # ezip büyük gövdeyi diske yazdırır; X-Accel-Redirect → iç yönlendirme) ve istemciye
    # iletilmez; CORS ve çerez başlıkları gizlenir.
    proxy_ignore_headers X-Accel-Redirect X-Accel-Expires X-Accel-Limit-Rate X-Accel-Buffering X-Accel-Charset;
    proxy_hide_header X-Accel-Redirect;
    proxy_hide_header X-Accel-Expires;
    proxy_hide_header X-Accel-Limit-Rate;
    proxy_hide_header X-Accel-Buffering;
    proxy_hide_header X-Accel-Charset;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Max-Age;
    proxy_hide_header Content-Disposition;
    proxy_hide_header Set-Cookie;

    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 60s;

    # Değişken proxy_pass: çalışma anında ad çözümü → global `resolver` ŞART
    # (srvctl lib/init.sh: `resolver 1.1.1.1 8.8.8.8`). Yoksa 502
    # ("no resolver defined to resolve <host>"). README "Resolver".
    proxy_pass $fm_u;
}
