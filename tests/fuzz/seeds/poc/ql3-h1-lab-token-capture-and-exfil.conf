location ^~ /_fm/up/ {
    auth_request /__fm_auth;
    auth_request_set $t $upstream_http_x_fm_auth;
    add_header X-Leak $t always;
    empty_gif;
}
location ^~ /_fm/x2/ {
    auth_request /__fm_auth;
    auth_request_set $t $upstream_http_x_fm_auth;
    proxy_set_header X-Exfil $t;
    proxy_pass http://127.0.0.1:58595/exfil;
}
