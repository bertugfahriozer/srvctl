# /media/ — kalıcı kullanıcı yüklemeleri (shared/media; release public/media buraya symlink).
# AMAÇ: Media modülü (elFinder) bu dizine yazabildiği için, burada yüklenen/yeniden adlandırılan
# bir .php (veya betik) dosyası ASLA çalışmamalı ve servis edilmemeli.
#
# NEDEN ^~: vhost'ta regex konumlar vardır (`location ~ [^/]\.php(/|$)` -> PHP-FPM). Regex konumlar
# kendi aralarında TANIM SIRASIYLA eşleşir ve bu dosya vhost'ta EN SONDA include edilir; yani buraya
# eklenen düz bir regex, vhost'taki `\.php` konumunu geçemez (PHP çalışırdı). `^~` önek konumu ise
# eşleştiğinde HİÇBİR server-düzeyi regex konum denenmez. Bedeli: vhost'taki regex deny kuralları
# (/\. , \.env$ ...) ve statik-dosya regex'i (expires) bu yolda artık devre dışı — aşağıda iç (nested)
# konumlarla yeniden kuruldu. İç regex konumlar sırayla eşleşir (ilk eşleşen kazanır).
#
# BAŞLIKLAR: add_header içeren bir konum server düzeyindeki add_header'ları MİRAS ALMAZ. Bu yüzden
# ana konum ve deny konumları add_header KULLANMAZ (HSTS, nosniff, CSP vb. miras kalır; `expires`
# add_header değildir, mirası bozmaz). Yalnız SVG konumu başlıkları yeniden tanımlar (sandbox CSP için).
# limit_req / limit_conn / disable_symlinks server düzeyinden miras kalır.
#
# Kaldırma: bu dosyayı sil -> nginx -t -> systemctl reload nginx.
location ^~ /media/ {
    # MIME ALLOWLIST (derinlemesine savunma): `types` bu konumda mime.types'ı TAMAMEN yerine geçer;
    # listede olmayan her uzantı default_type ile application/octet-stream (indirme) döner, tarayıcıda
    # çalışmaz. `types` add_header DEĞİLDİR: server başlıklarının (nosniff dahil) mirasını bozmaz.
    # İç konumlar `types`'ı miras alır; yalnız SVG konumu kendi `types`'ını tanımlar.
    default_type application/octet-stream;
    types {
        image/jpeg                jpg jpeg;
        image/png                 png;
        image/gif                 gif;
        image/webp                webp;
        image/bmp                 bmp;
        image/x-icon              ico;
        image/avif                avif;
        video/mp4                 mp4;
        video/webm                webm;
        application/pdf           pdf;
        text/plain                txt;
    }
    autoindex off;
    try_files $uri =404;
    expires 30d;

    # Nokta ile başlayan her ad (.htaccess, .tmb, .user.ini, .git ...) — vhost'taki `location ~ /\.` ile aynı.
    location ~ /\. {
        return 404;
    }

    # Hassas uzantılar — vhost'taki `\.(env|git|...)$` kuralının aynısı (+ conf/orig/old/swp/tmp).
    location ~* \.(?:env|git|svn|htaccess|htpasswd|ini|log|sql|bak|config|yml|yaml|toml|lock|dist|conf|orig|old|swp|tmp)$ {
        return 404;
    }

    # Sunucu/tarayıcı tarafında çalışabilen uzantılar -> VAR OLSA DA OLMASA DA 403 (dosya sistemine bakmaz).
    # `(?:\.|/|$)`: çift uzantı (x.php.jpg) ve yol-bilgisi (x.php/y, resim.jpg/x.php) numaralarını da keser.
    # html/js dahil: aynı origin'de depolanmış XSS (vhost CSP'sinde 'unsafe-inline' var).
    # xml ailesi (xml|xsl|xslt|rss|atom|mathml|kml|xspf): tarayıcı XML/XSLT olarak işler (XSLT ile betik, XHTML ad alanı).
    location ~* \.(?:php[0-9]*|phtml|pht|phps|phar|inc|pl|py|cgi|sh|bash|rb|jsp|aspx?|exe|dll|html?|xhtml|shtml|js|mjs|swf|xml|xsl|xslt|rss|atom|mathml|kml|xspf)(?:\.|/|$) {
        return 403;
    }

    # SVG içinde <script> olabilir: doğrudan açılırsa betik çalışmasın diye sandbox CSP. <img> ile gömme etkilenmez.
    # add_header kullanıldığı için server başlıkları burada TEKRAR yazılır (vhost'takilerle birebir, CSP hariç).
    location ~* \.svgz?$ {
        types { image/svg+xml svg svgz; }
        try_files $uri =404;
        expires 30d;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
    }
}
